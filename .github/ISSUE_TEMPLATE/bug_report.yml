name: Fork bug report
description: Diagnostic, emit, crash or performance regression in this fork
body:
  - type: input
    id: revision
    attributes:
      label: Fork commit and platform
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal TypeScript example, compiler options and exact command. Do not include private code or credentials.
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Expected and actual behavior
      description: Include the result with stock Go at the common revision in bench/pins.json, when available.
    validations:
      required: true
