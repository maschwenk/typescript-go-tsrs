name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        concurrent: ['true', 'false']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tsc/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Upstream package and compiler baseline tests
        working-directory: tsc
        env:
          TS_TEST_PROGRAM_SINGLE_THREADED: ${{ matrix.concurrent }}
        run: go test -count=1 ./...
      - name: Race tests for compiler and checker
        working-directory: tsc
        run: go test -race ./internal/compiler/... ./internal/checker/...
      - name: Build and vet
        working-directory: tsc
        run: |
          go vet ./internal/checker/... ./internal/compiler/...
          go build -pgo=off ./cmd/tsc
      - name: Benchmark harness tests
        run: python3 -m unittest discover -s bench -p 'test_*.py'
