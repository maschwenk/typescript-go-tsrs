name: Benchmark
on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional exact commit to validate; leaves the workflow definition at the selected ref'
        type: string
      parent_sha:
        description: 'Optional exact parent commit for an isolated step comparison'
        type: string
      runner:
        description: 'Linux runner label'
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, tsgo-backport-local]
      projects:
        description: 'Comma-separated tsrs projects (synthetic is always available)'
        default: 'synthetic,Compiler,Compiler-Unions,xstate-main,webpack'
      repetitions:
        description: 'Interleaved repetitions'
        default: '7'
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
  checks: write
concurrency:
  group: benchmark-${{ github.ref }}-${{ inputs.source_sha }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 75
    steps:
      - name: Validate an optional source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PARENT_SHA: ${{ inputs.parent_sha }}
        run: |
          if [ -n "$SOURCE_SHA" ] && [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          if [ -n "$PARENT_SHA" ] && [[ ! "$PARENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tsc/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.20.0
      - name: Read pinned tsrs source
        id: pins
        run: |
          echo "tsrs=$(python3 -c 'import json; print(json.load(open("bench/pins.json"))["tsrs"]["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: maschwenk/tsrs
          ref: ${{ steps.pins.outputs.tsrs }}
          path: .bench/tsrs
      - name: Restore tsrs native binary
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .bench/tsrs/target/release/tsrs
          key: tsrs-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.tsrs }}-release-1.99
      - name: Build pinned tsrs
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: .bench/tsrs
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --locked --release -p tsrs_cli
      - name: Save the completed native tsrs build immediately
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .bench/tsrs/target/release/tsrs
          key: tsrs-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.tsrs }}-release-1.99
      - name: Build stock, PR parent and fork
        env:
          PARENT: ${{ inputs.parent_sha || github.event.pull_request.base.sha }}
        run: |
          git worktree prune --expire now
          if [ -n "$PARENT" ]; then
            git fetch --depth=1 origin "$PARENT"
            python3 bench/build.py --reference "$PARENT"
          else
            python3 bench/build.py
          fi
      - name: Compare compilers
        env:
          PROJECTS: ${{ inputs.projects || 'synthetic,Compiler,Compiler-Unions' }}
          REPS: ${{ inputs.repetitions || '3' }}
          PARENT: ${{ inputs.parent_sha || github.event.pull_request.base.sha }}
        run: |
          extra=()
          if [ -n "$PARENT" ]; then extra+=(--parent .bench/bin/parent); fi
          python3 bench/run.py --stock .bench/bin/stock --fork .bench/bin/fork \
            --tsrs .bench/tsrs/target/release/tsrs --tsrs-source .bench/tsrs \
            --projects "$PROJECTS" --reps "$REPS" --label "$RUNNER_OS-$RUNNER_ARCH" \
            --out .bench/results/compare.json "${extra[@]}"
      - name: Publish comparison summary
        if: always()
        run: |
          if [ -f .bench/results/compare.md ]; then cat .bench/results/compare.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compiler-comparison
          path: .bench/results/
          retention-days: 30
      - name: Record the tested source commit
        if: always() && inputs.source_sha != ''
        env:
          CHECK_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHECK_NAME: compare
          JOB_RESULT: ${{ job.status }}
        run: |
          python3 - <<'CHECK'
          import datetime,json,os,re,urllib.request
          sha=os.environ['SOURCE_SHA']
          if not re.fullmatch('[0-9a-f]{40}',sha): raise SystemExit('A full source commit is required')
          result={'success':'success','failure':'failure','cancelled':'cancelled'}[os.environ['JOB_RESULT']]
          repo=os.environ['GITHUB_REPOSITORY']
          url=f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload={'name':os.environ['CHECK_NAME'],'head_sha':sha,'status':'completed','conclusion':result,
                   'completed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   'details_url':url,'output':{'title':'Linux validation of the exact source commit',
                   'summary':f"Source: {sha}. Result: {result}. Runner: {os.environ['RUNNER_OS']}/{os.environ['RUNNER_ARCH']}. Full logs and artifacts: {url}."}}
          request=urllib.request.Request(f'https://api.github.com/repos/{repo}/check-runs',data=json.dumps(payload).encode(),
                   headers={'Authorization':'Bearer '+os.environ['CHECK_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request) as response: recorded=json.load(response)
          print(recorded['html_url'])
          CHECK
